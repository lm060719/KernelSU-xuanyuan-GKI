name: Build KernelSU GKI AnyKernel3 (xuanyuan)

on:
  push:
    branches: [main, ccr-ba96cc45-3k0iz3]
    paths:
      - ".github/workflows/kernel-gki.yml"
      - "scripts/build.sh"
      - "scripts/add_xiaomi_hooks.py"
      - "scripts/verify_build.py"
      - "scripts/anykernel.sh"
  workflow_dispatch:
    inputs:
      gki_tag:
        description: "AOSP GKI tag (must be 6.6.118)"
        default: android15-6.6-2026-01_r43
      ksu_tag:
        description: "KernelSU tag"
        default: v3.3.1

permissions:
  contents: read

concurrency:
  group: kernelsu-gki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: KernelSU
            with_ksu: "1"
          - variant: noKernelSU
            with_ksu: "0"
    env:
      WITH_KSU: ${{ matrix.with_ksu }}
      GKI_ROOT: ${{ github.workspace }}/gki
      DIST_DIR: ${{ github.workspace }}/dist
      REPORT_DIR: ${{ github.workspace }}/reports
      OUT_DIR: ${{ github.workspace }}/out
      MANIFEST_BRANCH: common-android15-6.6-2026-01
      GKI_TAG: ${{ inputs.gki_tag || 'android15-6.6-2026-01_r43' }}
      KSU_TAG: ${{ inputs.ksu_tag || 'v3.3.1' }}
      JOBS: "3"
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Recover runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift
          sudo docker system prune -af || true
          df -h

      - name: Install repo and prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git python3 curl ca-certificates unzip zip zstd xz-utils build-essential
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 3 --output "$HOME/.local/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/.local/bin/repo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync AOSP GKI 6.6.118 sources
        run: bash scripts/build.sh prepare

      - name: Match stock version, allow stock-signed GKI modules, add Xiaomi F2FS hooks
        run: bash scripts/build.sh patch

      - name: Integrate KernelSU built-in
        if: matrix.with_ksu == '1'
        run: bash scripts/build.sh integrate

      - name: Compile with Kleaf / Bazel
        run: bash scripts/build.sh build

      - name: Verify Image against stock
        run: bash scripts/build.sh verify

      - name: Package AnyKernel3
        run: bash scripts/build.sh package

      - name: Upload reports (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.variant }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-xuanyuan-${{ matrix.variant }}
          path: |
            out/*.zip
            out/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      - name: Upload raw Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-xuanyuan-${{ matrix.variant }}
          path: out/Image
          retention-days: 30
          if-no-files-found: error
